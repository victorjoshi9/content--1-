version: '3.8'

services:
  ollama-webui:
    build:
      context: ..
      dockerfile: docker-ollama/Dockerfile
    container_name: ollama-complete
    ports:
      - "11434:11434"  # Ollama API
      - "3000:3000"    # Web UI
    environment:
      # Specify which models to pull on startup.
      # Includes the previously suggested coding/general models plus HF GGUF.
      # Note: This full list is large (tens of GB). Override MODELS for a lighter startup.
      MODELS: >-
        qwen2.5-coder:latest,deepseek-coder-v2:latest,qwen2.5:latest,llama3.2:latest,glm4:latest,nemotron-mini:latest,codellama:latest,hf.co/Jiunsong/supergemma4-26b-uncensored-gguf-v2:Q4_K_M
      # Web UI connects to local Ollama
      OLLAMA_HOST: "localhost:11434"
    volumes:
      # Persist models across restarts (optional - remove for ephemeral)
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 32G
        # For GPU support (NVIDIA), add reservations under this same deploy.resources block:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]

volumes:
  ollama-data:
